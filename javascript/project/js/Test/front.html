<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
     <script src="./front.js" defer></script>
    <link rel="stylesheet" href="./front.css" />
  </head>
  <body>
    <div class="container">
      <div class="title">Todo Task</div>

      <form class="todo">
          <input type="text" id="inputbox" placeholder="Enter your task" />
          <input type="submit" id="addBtn"  value="Add"/>
        </form>
        <div class="todoList">
         
            <div class="list">
              <div class="list-text">Go to market</div>
               <div class="list-done">Done</div>
              <div class="list-btn">Delete</div>
            </div>
        </div>
      </div>
    </div>
  </body>
</html>
